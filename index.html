<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurovision Fan Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>✨ Eurovision Fan Hub ✨</h1>
            <p>Your #1 source for news, articles, and history.</p>
        </div>
        <nav>
            <button onclick="loadContent('news')">Latest News</button>
            <button onclick="loadContent('articles')">Articles</button>
        </nav>
    </header>

    <div class="container">
        <main id="main-content">
            </main>
        
        <aside>
            <div class="widget">
                <h3>📅 On This Day</h3>
                <p id="on-this-day-text">Loading...</p>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Eurovision Fan Hub. Built for the fans.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
