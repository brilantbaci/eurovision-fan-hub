<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EuroFever — Your Eurovision Fan Hub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Nunito:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* ── SYSTEM VARIABLES (Controlled by Magic Wand) ── */
    :root {
      --bg: #08071a;
      --primary: #ff3d7f; /* Neon Pink */
      --accent: #e2b94a;  /* Gold */
      --teal: #00e5c8;
      --text: #f0edf8;
      --muted: #9b97b8;
      --border: rgba(226, 185, 74, 0.2);
      --card-bg: rgba(255, 255, 255, 0.04);
      --rounding: 14px;
    }

    /* ── BASE THEME ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Nunito', sans-serif; 
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ── SPARKLE FIELD ── */
    .sparkle-field { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .spark { 
      position: absolute; width: 2px; height: 2px; border-radius: 50%; 
      background: white; opacity: 0; 
      animation: twinkle var(--dur, 4s) infinite ease-in-out; 
    }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 0.7; transform: scale(1.2); } }

    /* ── HEADER ── */
    header { 
      position: sticky; top: 0; z-index: 100; 
      background: rgba(8, 7, 26, 0.9); backdrop-filter: blur(12px); 
      border-bottom: 1px solid var(--border); padding: 0 2rem; 
    }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .logo { 
      font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--accent); 
      text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .logo-star { 
      width: 20px; height: 20px; background: var(--primary); 
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); 
    }

    nav { display: flex; gap: 1.5rem; }
    nav a { 
      color: var(--muted); text-decoration: none; font-size: 0.8rem; 
      font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; cursor: pointer; 
    }
    nav a:hover { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

    /* ── CONTENT GRID ── */
    .container { 
      display: grid; grid-template-columns: 3fr 1fr; 
      max-width: 1200px; margin: 3rem auto; padding: 0 2rem; gap: 2.5rem; 
      position: relative; z-index: 1;
    }

    /* ── ARTICLE CARDS ── */
    .card {
      background: var(--card-bg); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: var(--rounding);
      padding: 2rem; margin-bottom: 1.5rem;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
    }
    .card:hover { 
      transform: translateY(-5px); border-color: var(--primary); 
      box-shadow: 0 10px 30px rgba(255, 61, 127, 0.15); 
    }
    .card .category { color: var(--accent); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; }
    .card h2 { font-family: 'Playfair Display', serif; color: #fff; font-size: 1.5rem; margin-bottom: 1rem; }
    .card p { color: var(--muted); font-size: 0.95rem; }

    /* ── SIDEBAR WIDGET ── */
    .widget {
      background: linear-gradient(135deg, var(--accent), #b8860b);
      color: #08071a; padding: 2rem; border-radius: var(--rounding);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: sticky; top: 100px;
    }
    .widget h3 { font-family: 'Cinzel', serif; margin-bottom: 1rem; font-weight: 700; }
    .widget a { color: #08071a; font-weight: 700; text-decoration: underline; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(8, 7, 26, 0.95); backdrop-filter: blur(15px);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: #0e0c25; border: 1px solid var(--accent); border-radius: var(--rounding);
      max-width: 800px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 3rem; position: relative;
    }
    .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; color: var(--accent); background: none; border: none; font-size: 2.5rem; cursor: pointer; }
    .modal-tag { color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 1rem; }
    .modal-title { font-family: 'Cinzel', serif; font-size: 2.2rem; color: #fff; margin-bottom: 1.5rem; line-height: 1.2; }
    .modal-body { line-height: 1.8; color: #ccc; white-space: pre-wrap; font-size: 1.1rem; }

    /* ── DESIGN LAB SIDEBAR ── */
    #adminSidebar {
      position: fixed; top: 0; right: -320px; width: 300px; height: 100vh;
      background: rgba(19, 16, 46, 0.98); border-left: 1px solid var(--accent);
      z-index: 9999; padding: 25px; transition: 0.4s ease; color: white;
    }
    #adminSidebar h3 { font-family: 'Cinzel', serif; color: var(--accent); margin-bottom: 25px; }
    .admin-group { margin-bottom: 20px; }
    .admin-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .admin-group input[type="color"] { width: 100%; height: 40px; background: none; border: none; cursor: pointer; }

    @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="sparkle-field" id="sparkleField"></div>

  <header>
    <div class="header-inner">
      <a onclick="showHome()" class="logo"><span class="logo-star"></span>EUROFEVER</a>
      <nav>
        <a onclick="showHome()">Home</a>
        <a onclick="filterCategory('News')">News</a>
        <a onclick="filterCategory('History')">History</a>
        <a href="scoreboard.html">Scoreboard</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <main>
      <h2 id="dynamic-title" style="font-family: 'Cinzel'; color: var(--accent); margin-bottom: 2rem;">✦ Latest News</h2>
      <div id="dynamic-articles">
        <p style="color: var(--muted);">Tuning in to Eurovision frequencies...</p>
      </div>
    </main>

    <aside>
      <div class="widget">
        <h3>2026 Countdown</h3>
        <p>The road to the trophy is heating up. Check the leaderboard to see who is leading the fan vote!</p>
        <a href="scoreboard.html">View Scores →</a>
      </div>
    </aside>
  </div>

  <div class="modal-overlay" id="articleModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-tag" id="modalTag">NEWS</div>
      <h2 class="modal-title" id="modalTitle">Loading Article...</h2>
      <button onclick="copyShareLink()" id="shareBtn" style="background:none; border:1px solid var(--border); color:var(--accent); padding:6px 12px; border-radius:4px; cursor:pointer; font-size:0.8rem; margin-bottom:1.5rem; font-weight:bold;">🔗 Copy Share Link</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <button onclick="toggleAdmin()" style="position:fixed; bottom:25px; right:25px; width:55px; height:55px; border-radius:50%; background:var(--accent); border:none; cursor:pointer; z-index:10000; box-shadow:0 0 20px rgba(226,185,74,0.4); font-size:24px;">🪄</button>

  <div id="adminSidebar">
    <h3>Design Lab</h3>
    <div class="admin-group">
      <label>Accent Color (Gold/Headers)</label>
      <input type="color" oninput="updateStyle('--accent', this.value)" value="#e2b94a">
    </div>
    <div class="admin-group">
      <label>Primary Action (Pink)</label>
      <input type="color" oninput="updateStyle('--primary', this.value)" value="#ff3d7f">
    </div>
    <div class="admin-group">
      <label>Background Color</label>
      <input type="color" oninput="updateStyle('--bg', this.value)" value="#08071a">
    </div>
    <div class="admin-group">
      <label>Card Rounding</label>
      <input type="range" min="0" max="50" oninput="updateStyle('--rounding', this.value + 'px')" value="14">
    </div>
    <button onclick="exportStyles()" style="width:100%; background:var(--primary); color:white; border:none; padding:12px; border-radius:5px; cursor:pointer; font-weight:bold; margin-top:10px;">Save Design</button>
  </div>

  <script>
    // --- SPARKLES ---
    const field = document.getElementById('sparkleField');
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (3 + Math.random() * 5) + 's');
      s.style.setProperty('--delay', (Math.random() * 5) + 's');
      field.appendChild(s);
    }

    // --- CMS LOGIC ---
    const sheetId = '1hdaSAUNFD8Q6t1wGJ_kqnx7AabbMefj4RuwMU7Oo-aM';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;
    let allArticles = [];

    Papa.parse(csvUrl, {
      download: true, header: true,
      complete: function(r) {
        allArticles = r.data.filter(a => a.Title && a.Title.trim() !== '');
        
        const urlParams = new URLSearchParams(window.location.search);
        const sharedArticle = urlParams.get('article');
        if (sharedArticle) {
          const art = allArticles.find(a => a.Title === sharedArticle);
          if (art) { renderCards(allArticles.slice(0, 10)); openModal(art, false); }
          else showHome();
        } else showHome();
      }
    });

    function renderCards(data) {
      const grid = document.getElementById('dynamic-articles');
      grid.innerHTML = '';
      data.forEach(a => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openModal(a, true);
        div.innerHTML = `
          <div class="category">${a.Category || 'NEWS'}</div>
          <h2>${a.Title}</h2>
          <p>${a.Summary || ''}</p>
          <div style="margin-top:1rem; font-size:0.75rem; color:var(--muted);">${a.Date || ''}</div>
        `;
        grid.appendChild(div);
      });
    }

    function showHome() { 
      document.getElementById('dynamic-title').innerText = "✦ Latest News";
      renderCards(allArticles.slice(0, 10)); 
    }

    function filterCategory(cat) {
      document.getElementById('dynamic-title').innerText = "✦ " + cat + " Archive";
      const filtered = allArticles.filter(a => (a.Category || '').toLowerCase().includes(cat.toLowerCase()));
      renderCards(filtered);
    }

    function openModal(a, updateUrl) {
      document.getElementById('modalTitle').innerText = a.Title;
      document.getElementById('modalBody').innerText = a.Content;
      document.getElementById('modalTag').innerText = a.Category || 'NEWS';
      document.getElementById('articleModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';

      if (updateUrl) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?article=' + encodeURIComponent(a.Title);
        window.history.pushState({path:newUrl}, '', newUrl);
      }
    }

    function closeModal() {
      document.getElementById('articleModal').style.display = 'none';
      document.body.style.overflow = 'auto';
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
      window.history.pushState({path:cleanUrl}, '', cleanUrl);
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.getElementById('shareBtn');
        btn.innerText = "✅ Link Copied!";
        setTimeout(() => { btn.innerText = "🔗 Copy Share Link"; }, 2000);
      });
    }

    // --- DESIGNER LOGIC ---
    function toggleAdmin() {
      const bar = document.getElementById('adminSidebar');
      bar.style.right = bar.style.right === '0px' ? '-320px' : '0px';
    }
    function updateStyle(v, val) { document.documentElement.style.setProperty(v, val); }
    function exportStyles() {
      const root = document.documentElement;
      const css = `:root { 
  --bg: ${getComputedStyle(root).getPropertyValue('--bg')}; 
  --primary: ${getComputedStyle(root).getPropertyValue('--primary')}; 
  --accent: ${getComputedStyle(root).getPropertyValue('--accent')}; 
  --rounding: ${getComputedStyle(root).getPropertyValue('--rounding')}; 
}`;
      navigator.clipboard.writeText(css); alert("Styles copied to clipboard! Paste into your GitHub :root section.");
    }
  </script>
</body>
</html>
